    #     release_apk_path=$(find . -path "*collect_app/build/outputs/apk/release/*release-unsigned.apk" -type f | head -n 1)
    #     if [ -z "$release_apk_path" ]; then
    #       # 如果没有找到未签名的 APK，尝试查找已对齐但未签名的 APK (例如 *-release-unaligned.apk)
    #       release_apk_path=$(find . -path "*collect_app/build/outputs/apk/release/*release-*.apk" -type f | head -n 1)
    #     fi
    #     echo "RELEASE_APK_PATH=$release_apk_path"
    #     echo "release_apk_path=$release_apk_path" >> $GITHUB_OUTPUT
    # - name: Upload Release APK (Unaligned/Unsigned)
    #   uses: actions/upload-artifact@v4
