name: Build ODK Collect APK

# 触发条件：
# 1. 推送到 main 分支
# 2. 手动在 GitHub Actions 界面触发 (workflow_dispatch)
on:
  push:
    branches:
      - main # 当推送到 'main' 分支时触发
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest # 使用最新的 Ubuntu 环境

    steps:
    # 步骤 1: 检出代码
    - name: Checkout code
      uses: actions/checkout@v4 # 使用 v4 版本的动作
      with:
        submodules: recursive # ODK Collect 可能包含子模块，需要递归检出

    # 步骤 2: 设置 Java 环境
    - name: Set up JDK 17
      uses: actions/setup-java@v4 # 使用 v4 版本的动作
      with:
        distribution: 'temurin' # 使用 Eclipse Temurin 发行版
        java-version: 17 # ODK Collect 需要 Java 17

    # 步骤 3: 缓存 Gradle 包和依赖项
    - name: Cache Gradle packages
      uses: actions/cache@v4 # 使用 v4 版本的动作
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          !~/.gradle/caches/build-cache-*
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/buildSrc/**/*.kt') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    # 步骤 4: 使 gradlew 脚本可执行
    - name: Make Gradle wrapper executable
      run: chmod +x ./gradlew

    # 步骤 5: 下载 Robolectric 依赖项 (如果测试需要的话，这一步可能有助于首次构建)
    # - name: Download Robolectric Dependencies (Optional)
    #   run: ./download-robolectric-deps.sh

    # 步骤 6: 构建 Debug APK
    # 使用 --no-daemon 选项避免在 CI 环境中可能出现的问题
    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    # 步骤 7: 查找生成的 APK 文件
    - name: Find APK
      id: find_apk # 为步骤设置 ID 以便后续使用输出
      run: |
        # 在标准的 Gradle Android 项目结构中查找 APK
        apk_path=$(find . -path "*collect_app/build/outputs/apk/debug/*debug.apk" -type f | head -n 1)
        echo "APK_PATH=$apk_path"
        echo "apk_path=$apk_path" >> $GITHUB_OUTPUT # 将路径设置为输出变量

    # 步骤 8: 上传 Debug APK 作为构件
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4 # 使用 v4 版本的动作
      with:
        name: ODK-Collect-debug-apk # 构件名称
        path: ${{ steps.find_apk.outputs.apk_path }} # 上传上一步找到的 APK 文件
        if-no-files-found: error # 如果找不到文件则报错
        retention-days: 30 # 保留 30 天

    # --- 可选：构建 Release APK (如果你有签名密钥) ---
    # 如果你没有提供签名密钥，则跳过这部分或仅构建未签名的 release APK。
    # - name: Build Release APK (Unaligned, Unsigned)
    #   run: ./gradlew assembleRelease --no-daemon
